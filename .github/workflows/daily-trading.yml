name: Daily Stock Trading Bot

on:
  push:
  schedule:
  
  #   # 9:30 AM ET (Market Open) = 13:30 UTC
  #   - cron: '30 13 * * 1-5'  # Monday-Friday at 13:30 UTC
  #   # 12:30 PM ET (Mid-Market) = 16:30 UTC
  #   - cron: '30 16 * * 1-5'  # Monday-Friday at 16:30 UTC
  # workflow_dispatch: # Manual trigger for testing

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Alpaca secrets are set
      run: |
        test -n "$ALPACA_API_KEY"
        test -n "$ALPACA_API_SECRET"

    - name: Create data directories
      run: |
        mkdir -p data_storage

    - name: Run trading bot
      run: python stock_bot.py

    - name: Commit and push data changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data_storage/
        git diff --staged --quiet || git commit -m "Update trading data [automated]"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
