name: Daily Stock Trading Bot

# Automatic runs are disabled so a public repo does not trade or
# publish account logs on every push. Trigger this workflow manually
# from the Actions tab when you want a paper-trading cycle.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Alpaca secrets are set
      run: |
        test -n "$ALPACA_API_KEY"
        test -n "$ALPACA_API_SECRET"

    - name: Create data directories
      run: |
        mkdir -p data_storage

    - name: Run trading bot
      run: python stock_bot.py

    - name: Commit and push data changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data_storage/
        git diff --staged --quiet || git commit -m "Update trading data [automated]"
        git push
